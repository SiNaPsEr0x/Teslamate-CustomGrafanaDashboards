name: SiNaPsE · TeslaMate Italiano + Custom Dashboards

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  packages: write

concurrency:
  # A successful run publishes one bot-authored state commit. Give that skipped
  # follow-up run its own group so it cannot cancel the parent during artifact upload.
  group: ${{ github.event_name == 'push' && github.event.head_commit.author.name == 'github-actions[bot]' && github.run_id || 'italian-localization-upstream-sync' }}
  cancel-in-progress: true

jobs:
  distribution:
    if: github.repository == 'SiNaPsEr0x/Teslamate-CustomGrafanaDashboards' && (github.event_name != 'push' || github.event.head_commit.author.name != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout italiano
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.SINAPSE_UNIFIED_SYNC_SSH_KEY }}

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update both upstreams, apply patches, build and test distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/manage.py --runtime --publish --output "${{ runner.temp }}/unified-output"

      - name: Upload Italian dashboards and validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sinapse-teslamate-${{ github.run_id }}
          path: ${{ runner.temp }}/unified-output/
          retention-days: 30
          if-no-files-found: error

  publish-images:
    name: Publish unified Docker image to GHCR
    needs: distribution
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout validated main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Resolve validated commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish unified TeslaMate + Grafana image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.unified
          push: true
          tags: |
            ghcr.io/sinapser0x/teslamate:latest
            ghcr.io/sinapser0x/teslamate:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/SiNaPsEr0x/Teslamate-CustomGrafanaDashboards
            org.opencontainers.image.description=TeslaMate italiano + Grafana Custom Dashboards in one Compose-ready image

  verify-standalone-compose:
    name: Verify public single-YAML Docker Compose deployment
    needs: publish-images
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout published compose
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Validate compose without environment file
        shell: bash
        run: |
          rm -f .env
          docker compose -f compose.yml config >/dev/null

      - name: Deploy exactly like a new user without registry login
        shell: bash
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          for attempt in 1 2 3 4 5; do
            if docker compose -f compose.yml up -d --pull always; then
              exit 0
            fi
            echo "Registry image not ready yet; retry $attempt/5"
            sleep 10
          done
          exit 1

      - name: Verify generated credentials, TeslaMate, Grafana and datasource
        shell: bash
        run: |
          set -euo pipefail

          BOOTSTRAP_LOGS="$(docker compose -f compose.yml logs --no-color bootstrap)"
          TM_PASSWORD="$(printf '%s\n' "$BOOTSTRAP_LOGS" | sed -n 's/.*TeslaMate  -> user: teslamate  password: //p' | tail -n 1)"
          GF_PASSWORD="$(printf '%s\n' "$BOOTSTRAP_LOGS" | sed -n 's/.*Grafana    -> user: admin      password: //p' | tail -n 1)"
          test -n "$TM_PASSWORD"
          test -n "$GF_PASSWORD"

          ready=0
          for _ in $(seq 1 120); do
            if [ "$(curl -sS -o /dev/null -w '%{http_code}' -u "teslamate:$TM_PASSWORD" http://127.0.0.1:4000/)" = "200" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1

          status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/)"
          test "$status" = "401"

          ready=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["database"] == "ok"'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1

          curl -fsS -u "admin:$GF_PASSWORD" http://127.0.0.1:3000/api/user \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["login"] == "admin"'
          curl -fsS -u "admin:$GF_PASSWORD" http://127.0.0.1:3000/api/datasources/uid/TeslaMate/health \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"] == "OK"'
          curl -fsS -u "admin:$GF_PASSWORD" 'http://127.0.0.1:3000/api/search?type=dash-db&limit=5000' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d) > 0'

          REPEAT="$(docker compose -f compose.yml run --rm --no-deps bootstrap)"
          printf '%s\n' "$REPEAT" | grep -Fq "$TM_PASSWORD"
          printf '%s\n' "$REPEAT" | grep -Fq "$GF_PASSWORD"

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose -f compose.yml ps -a || true
          docker compose -f compose.yml logs --no-color --tail=300 || true

      - name: Clean verification stack
        if: always()
        run: docker compose -f compose.yml down -v --remove-orphans || true
