name: sinapse-teslamate

# Standalone deployment: this file is the only configuration artifact required.
# On first start, the bootstrap service generates persistent random credentials in
# the sinapse-secrets Docker volume. Existing installations may temporarily keep
# their old environment values; when the volume is empty they are imported once.

services:
  bootstrap:
    image: alpine:3.22
    restart: "no"
    environment:
      DATABASE_PASS: ${DATABASE_PASS:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        mkdir -p /run/sinapse

        write_secret() {
          name="$$1"
          seed="$$2"
          file="/run/sinapse/$$name"
          if [ ! -s "$$file" ]; then
            if [ -n "$$seed" ]; then
              printf '%s' "$$seed" > "$$file"
            else
              head -c 48 /dev/urandom | base64 | tr -d '\n' > "$$file"
            fi
          fi
        }

        write_secret database_pass "$$DATABASE_PASS"
        write_secret encryption_key "$$ENCRYPTION_KEY"
        write_secret basic_auth_password "$$BASIC_AUTH_PASSWORD"
        write_secret grafana_admin_password "$$GRAFANA_ADMIN_PASSWORD"
        chmod 0444 /run/sinapse/*

        echo ""
        echo "=== SiNaPsE TeslaMate credentials ==="
        echo "TeslaMate  -> user: teslamate  password: $$(cat /run/sinapse/basic_auth_password)"
        echo "Grafana    -> user: admin      password: $$(cat /run/sinapse/grafana_admin_password)"
        echo "Credentials are persistent in the sinapse-secrets Docker volume."
        echo "Show them again with: docker compose -f compose.yml logs bootstrap"
        echo "======================================"
    volumes:
      - sinapse-secrets:/run/sinapse
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  basic-auth:
    image: httpd:2.4-alpine
    restart: "no"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        htpasswd -nbB teslamate "$$(cat /run/sinapse/basic_auth_password)" > /auth/.htpasswd
    volumes:
      - sinapse-secrets:/run/sinapse:ro
      - traefik-auth:/auth
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  proxy:
    image: traefik:v3.6
    restart: unless-stopped
    depends_on:
      basic-auth:
        condition: service_completed_successfully
    command:
      - "--global.sendAnonymousUsage=false"
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.teslamate.address=:4000"
      - "--entrypoints.grafana.address=:3000"
    ports:
      - "4000:4000"
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-auth:/auth:ro
    security_opt:
      - no-new-privileges:true

  teslamate:
    image: ghcr.io/sinapser0x/teslamate:latest
    user: "10000:10001"
    restart: unless-stopped
    environment:
      SINAPSE_SERVICE: teslamate
      SINAPSE_SECRETS_DIR: /run/sinapse
      DATABASE_USER: teslamate
      DATABASE_NAME: teslamate
      DATABASE_HOST: database
      MQTT_HOST: mosquitto
      CHECK_ORIGIN: "false"
      TZ: Europe/Rome
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:
      - sinapse-secrets:/run/sinapse:ro
      - teslamate-import:/opt/app/import
    labels:
      traefik.enable: "true"
      traefik.http.services.teslamate.loadbalancer.server.port: "4000"
      traefik.http.middlewares.teslamate-auth.basicauth.realm: "teslamate"
      traefik.http.middlewares.teslamate-auth.basicauth.usersfile: "/auth/.htpasswd"
      traefik.http.routers.teslamate.rule: "PathPrefix(`/`)"
      traefik.http.routers.teslamate.entrypoints: "teslamate"
      traefik.http.routers.teslamate.middlewares: "teslamate-auth"
    cap_drop:
      - ALL

  database:
    image: postgres:18-trixie
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: teslamate
      POSTGRES_PASSWORD_FILE: /run/sinapse/database_pass
      POSTGRES_DB: teslamate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sinapse-secrets:/run/sinapse:ro
      - teslamate-db:/var/lib/postgresql

  grafana:
    image: ghcr.io/sinapser0x/teslamate:latest
    user: "472:0"
    restart: unless-stopped
    environment:
      SINAPSE_SERVICE: grafana
      SINAPSE_SECRETS_DIR: /run/sinapse
      DATABASE_USER: teslamate
      DATABASE_NAME: teslamate
      DATABASE_HOST: database
      GF_SECURITY_ADMIN_USER: admin
      GF_AUTH_BASIC_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_LANGUAGE: it-IT
      TZ: Europe/Rome
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    volumes:
      - sinapse-secrets:/run/sinapse:ro
      - teslamate-grafana:/var/lib/grafana
    labels:
      traefik.enable: "true"
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
      traefik.http.routers.grafana.rule: "PathPrefix(`/`)"
      traefik.http.routers.grafana.entrypoints: "grafana"

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - mosquitto-data:/mosquitto/data

volumes:
  sinapse-secrets:
  teslamate-db:
  teslamate-grafana:
  teslamate-import:
  mosquitto-data:
  traefik-auth:
